{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrapper">
<div class="auth-card" style="max-width:560px">
    <div class="auth-header">
        <div class="auth-icon-wrap animate-float">
            <span data-icon="register" data-size="60" data-color="#1D9E75"></span>
        </div>
        <div class="auth-title">CREATE ACCOUNT</div>
        <div class="auth-subtitle">AI FRAUD DETECTION SYSTEM &middot; SRI LANKA</div>
    </div>
    <div class="auth-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label"><span data-icon="user" data-size="14"></span> &nbsp; USERNAME</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span data-icon="user" data-size="14"></span> &nbsp; FULL NAME</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Your full name" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label"><span data-icon="mail" data-size="14"></span> &nbsp; EMAIL ADDRESS</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label"><span data-icon="lock" data-size="14"></span> &nbsp; PASSWORD</label>
                    <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><span data-icon="lock" data-size="14"></span> &nbsp; CONFIRM</label>
                    <input type="password" name="confirm" class="form-control" placeholder="Repeat password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-cyber btn-block" style="margin-bottom:15px">
                <span data-icon="register" data-size="18"></span> &nbsp; CREATE ACCOUNT
            </button>
        </form>
        <p style="text-align:center;color:var(--text-muted);font-size:0.85rem">
            Already have account? <a href="/login" class="auth-link">Login here</a>
        </p>
    </div>
</div>
</div>
{% endblock %}
