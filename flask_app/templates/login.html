{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon-wrap animate-float">
            <span data-icon="shield" data-size="60" data-color="#1D9E75"></span>
        </div>
        <div class="auth-title">SECURE LOGIN</div>
        <div class="auth-subtitle">AI FRAUD DETECTION SYSTEM &middot; SRI LANKA</div>
    </div>
    <div class="auth-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><span data-icon="user" data-size="14"></span> &nbsp; USERNAME</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label class="form-label"><span data-icon="lock" data-size="14"></span> &nbsp; PASSWORD</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="form-check">
                <input type="checkbox" name="remember" id="remember" style="accent-color:var(--accent);width:16px;height:16px">
                <label for="remember" style="color:var(--text-secondary);font-size:0.9rem">Remember me</label>
            </div>
            <button type="submit" class="btn btn-cyber btn-block" style="margin-bottom:15px">
                <span data-icon="login" data-size="18"></span> &nbsp; LOGIN TO SYSTEM
            </button>
        </form>
        <div class="auth-divider">or continue with</div>
        <a href="/face-login" class="btn btn-block" style="background:var(--accent-dim);color:var(--accent)!important;border:1px solid var(--border);margin-bottom:20px;text-decoration:none">
            <span data-icon="camera" data-size="18" data-color="#1D9E75"></span> &nbsp; FACE RECOGNITION LOGIN
        </a>
        <p style="text-align:center;color:var(--text-muted);font-size:0.85rem">
            No account? <a href="/register" class="auth-link">Register here</a>
        </p>
        <div style="margin-top:15px;padding:12px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid var(--border);text-align:center">
            <span style="color:var(--text-muted);font-size:0.8rem">
                Default: <span style="color:var(--accent)">admin</span> / <span style="color:var(--accent)">admin123</span>
            </span>
        </div>
    </div>
</div>
</div>
{% endblock %}
