{% extends "fraud/_layout.html" %}
{% block title %}Mobile Payment Fraud{% endblock %}
{% block fraud_content %}
<div class="fraud-header" style="display:flex;align-items:center;justify-content:space-between">
  <div>
    <div class="fraud-title">Mobile Payment Fraud</div>
    <div class="fraud-sub">Dialog Pay · genie · FriMi · mCash · iPay</div>
  </div>
  <button type="button" class="btn-analyze" id="pdfBtn" onclick="generatePDF()" style="display:none;padding:10px 20px;background:linear-gradient(135deg, var(--accent), #0F6E56);border:1px solid rgba(29,158,117,0.3);color:white;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.9rem;white-space:nowrap">📄 Download PDF</button>
</div>

<div class="input-grid">
  <div class="input-section">
    <div class="input-section-title">Payment Details</div>
    <div class="form-group"><label for="amount_lkr">Amount (Rs.)</label><input class="form-control" id="amount_lkr" type="number" value="500" min="1" max="100000"></div>
    <div class="form-group"><label for="hour">Hour: <span class="range-val" id="hour_val">12</span></label><div class="range-wrap"><input type="range" id="hour" min="0" max="23" value="12" oninput="document.getElementById('hour_val').textContent=this.value"></div></div>
    <div class="form-group"><label for="top_up_frequency">Top-up Frequency</label><input class="form-control" id="top_up_frequency" type="number" value="3" min="0" max="50"></div>
    <div class="form-group"><label for="sim_age_days">SIM Age (days)</label><input class="form-control" id="sim_age_days" type="number" value="365" min="0" max="3000"></div>
  </div>
  <div class="input-section">
    <div class="input-section-title">Risk Signals</div>
    <div class="form-group"><label for="is_roaming">Roaming?</label><select class="form-control" id="is_roaming"><option value="0">No (Safe)</option><option value="1">Yes (Warning)</option></select></div>
    <div class="form-group"><label for="pin_attempts">PIN Attempts</label><input class="form-control" id="pin_attempts" type="number" value="0" min="0" max="10"></div>
    <div class="form-group"><label for="receiver_known">Receiver Known?</label><select class="form-control" id="receiver_known"><option value="1">Yes (Safe)</option><option value="0">No (Warning)</option></select></div>
    <div class="form-group"><label for="transaction_speed">Transaction Speed (sec): <span class="range-val" id="speed_val">2.0</span></label><div class="range-wrap"><input type="range" id="transaction_speed" min="0.1" max="10" step="0.1" value="2.0" oninput="document.getElementById('speed_val').textContent=parseFloat(this.value).toFixed(1)"></div></div>
  </div>
</div>

<button type="button" class="btn-analyze" id="analyzeBtn" onclick="analyze()">Check Payment</button>

<div class="result-card" id="result">
  <div class="result-verdict" id="verdict">
    <div class="verdict-icon" id="vIcon"></div>
    <div class="verdict-label" id="vLabel"></div>
    <div class="verdict-detail" id="vDetail"></div>
  </div>
  <div class="result-metrics">
    <div class="result-metric"><div class="metric-val" id="mProb">—</div><div class="metric-lbl">Fraud Probability</div></div>
    <div class="result-metric"><div class="metric-val" id="mRisk">—</div><div class="metric-lbl">Risk Level</div></div>
    <div class="result-metric"><div class="metric-val" id="mDecision">—</div><div class="metric-lbl">Decision</div></div>
  </div>
  <div class="gauge-bar" style="margin-top:16px"><div class="gauge-fill" id="gauge" style="width:0%"></div></div>
</div>

{% endblock %}
{% block extra_js %}
<script>
async function analyze(){
  const btn=document.getElementById('analyzeBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Checking...';
  const payload={amount_lkr:+document.getElementById('amount_lkr').value,hour:+document.getElementById('hour').value,top_up_frequency:+document.getElementById('top_up_frequency').value,sim_age_days:+document.getElementById('sim_age_days').value,is_roaming:+document.getElementById('is_roaming').value,pin_attempts:+document.getElementById('pin_attempts').value,receiver_known:+document.getElementById('receiver_known').value,transaction_speed:+document.getElementById('transaction_speed').value};
  try{const res=await fetch('/fraud/mobile/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await res.json();if(d.error){alert('Error: '+d.error);return;}showResult(d);}catch(e){alert('Failed: '+e);}finally{btn.disabled=false;btn.innerHTML='Check Payment';}
}
function showResult(d){
  const rc=document.getElementById('result');rc.classList.add('show');
  document.getElementById('verdict').className='result-verdict '+(d.fraud?'fraud':'safe');
  document.getElementById('vIcon').innerHTML=d.fraud?icon('alert',28,'#E24B4A'):icon('check',28,'#1D9E75');
  document.getElementById('vLabel').className='verdict-label '+(d.fraud?'fraud-text':'safe-text');
  document.getElementById('vLabel').textContent=d.fraud?'FRAUDULENT PAYMENT':'LEGITIMATE PAYMENT';
  document.getElementById('vDetail').textContent='Probability: '+d.pct;
  document.getElementById('mProb').textContent=d.pct;
  document.getElementById('mRisk').innerHTML='<span class="risk-badge risk-'+d.risk+'">'+d.risk+'</span>';
  document.getElementById('mDecision').textContent=d.decision;
  const p=Math.round(d.prob*100);const c=p>65?'#E24B4A':p>40?'#EF9F27':'#1D9E75';
  const g=document.getElementById('gauge');g.style.width=p+'%';g.style.background=`linear-gradient(90deg,#1D9E75,${c})`;
  rc.scrollIntoView({behavior:'smooth',block:'nearest'});
  
  // Show PDF button
  document.getElementById('pdfBtn').style.display='inline-block';
  // Store current data for PDF generation
  window.currentAnalysisData = d;
  window.currentTransactionData = {
    amount_lkr:+document.getElementById('amount_lkr').value,
    hour:+document.getElementById('hour').value,
    top_up_frequency:+document.getElementById('top_up_frequency').value,
    sim_age_days:+document.getElementById('sim_age_days').value,
    is_roaming:+document.getElementById('is_roaming').value,
    pin_attempts:+document.getElementById('pin_attempts').value,
    receiver_known:+document.getElementById('receiver_known').value,
    transaction_speed:+document.getElementById('transaction_speed').value,
  };
}

async function generatePDF() {
  if (!window.currentTransactionData || !window.currentAnalysisData) {
    alert('Please analyze a payment first');
    return;
  }
  
  const btn = document.getElementById('pdfBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating PDF...';
  
  try {
    const payload = window.currentTransactionData;
    const res = await fetch('/fraud/mobile/pdf', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    if (!res.ok) {
      throw new Error('PDF generation failed');
    }
    
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mobile_payment_fraud_report_${new Date().toISOString().slice(0,10)}.pdf`;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
    
  } catch(e) {
    alert('PDF generation failed: ' + e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📄 Download PDF';
  }
}
</script>
{% endblock %}
